# On each new commit to master, create/update a PR with release
# automatically bumps version and creates changelog as per conventional commits
name: Release Github

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # release-please runs as the bee-runner app, not with GITHUB_TOKEN: GitHub Actions
      # will no longer be allowed to create or approve pull requests in this org.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BEE_RUNNER_APP_ID }}
          private-key: ${{ secrets.BEE_RUNNER_KEY }}
          # Least privilege: release-please updates the release PR (and its labels) and creates the release + tag.
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: node
          package-name: gateway-ui
          bump-minor-pre-major: true
